{"name": "SV_RESTAURANT_RECOVERY_PERFORMANCE", "description": "Synthetic restaurant recovery. Guest occasions are not unique people. Descriptive analysis, never causal attribution. Expires: 2026-10-22.", "tables": [{"name": "evidence", "description": "Restaurant/day/date/channel paired cells. Default eight-week window 2026-07-20 through 2026-09-13. Sum rates using summed denominators. Gross losses require aggregating to restaurant first, then summing negative restaurant changes. Daypart and channel breakdowns are alternatives. Whole-window exclusion of closures removes the entire restaurant, including its pre-closure observations. Report excluded pairs with totals. Never join operations to channel rows. Guest occasions count guests served on each occasion, NOT transactions or checks and NOT unique people. Do not call guest occasions transactions, orders, or check counts. An incomplete-cell count alone cannot bound the missing volume; never assert excluded data is negligible or cannot change the conclusion. A gap present in the first observed week does not prove it began before that window; retrieve earlier evidence or leave onset unknown.  A restaurant closing during the window has both pre-closure performance and closed-day contributions; do not attribute its entire period change to closed days. Query by BUSINESS_DATE relative to CLOSE_DATE to separate them. An opening has explicit complete zero baseline observations outside its lifecycle, not missing pairs. For whole-window comparable restaurants require OPEN_DATE <= DATEADD(day,-364,window_start) and (CLOSE_DATE IS NULL OR CLOSE_DATE >= window_end_exclusive); do not hardcode restaurant IDs or names. Comparability and observation completeness are separate: always report excluded pairs. Excluding closures alone still includes openings and must not be called comparable-store growth.", "base_table": {"database": "SNOWFLAKE_EXAMPLE", "schema": "RESTAURANT_RECOVERY", "table": "PAIRED_PERFORMANCE"}, "dimensions": [{"name": "release_id", "expr": "RELEASE_ID", "data_type": "VARCHAR", "description": "Immutable fictional release."}, {"name": "restaurant_id", "expr": "RESTAURANT_ID", "data_type": "VARCHAR", "description": "Stable fictional restaurant ID."}, {"name": "restaurant_name", "expr": "RESTAURANT_NAME", "data_type": "VARCHAR", "description": "Fictional restaurant name."}, {"name": "market", "expr": "MARKET", "data_type": "VARCHAR", "description": "Fictional market, not actual customer DMA."}, {"name": "business_date", "expr": "BUSINESS_DATE", "data_type": "DATE", "description": "Local business date. Default 2026-07-20 inclusive to 2026-09-14 exclusive."}, {"name": "baseline_date", "expr": "BASELINE_DATE", "data_type": "DATE", "description": "Explicit 364-day aligned baseline date."}, {"name": "as_of_date", "expr": "AS_OF_DATE", "data_type": "DATE", "description": "Fixed synthetic as-of date, not today."}, {"name": "daypart", "expr": "DAYPART", "data_type": "VARCHAR", "description": "Breakfast, Lunch, Dinner, Late night."}, {"name": "evidence_id", "expr": "EVIDENCE_ID", "data_type": "VARCHAR", "description": "Cell evidence identity; aggregate answers must also state filters and population."}, {"name": "channel", "expr": "CHANNEL", "data_type": "VARCHAR", "description": "Dine-in, Takeaway, Delivery."}, {"name": "lifecycle", "expr": "LIFECYCLE", "data_type": "VARCHAR", "description": "Cell lifecycle; for whole-window comp eligibility use open/close dates."}, {"name": "open_date", "expr": "OPEN_DATE", "data_type": "DATE", "description": "Inclusive opening date."}, {"name": "close_date", "expr": "CLOSE_DATE", "data_type": "DATE", "description": "Exclusive closure date, nullable."}, {"name": "pair_complete", "expr": "PAIR_COMPLETE", "data_type": "BOOLEAN", "description": "Both aligned observations complete."}], "metrics": [{"name": "m_current_guests", "expr": "SUM(CURRENT_GUESTS)", "description": "Current paired guest occasions."}, {"name": "m_baseline_guests", "expr": "SUM(BASELINE_GUESTS)", "description": "Same paired population in baseline."}, {"name": "m_guest_change", "expr": "SUM(GUEST_CHANGE)", "description": "Signed change, not gross loss."}, {"name": "m_guest_change_pct", "expr": "100.0 * SUM(GUEST_CHANGE) / NULLIF(SUM(BASELINE_GUESTS),0)", "description": "Weighted change percentage; null for zero baseline."}, {"name": "m_current_sales", "expr": "SUM(CURRENT_SALES)", "description": "Net USD sales excluding tax/tips."}, {"name": "m_baseline_sales", "expr": "SUM(BASELINE_SALES)", "description": "Baseline net USD sales."}, {"name": "m_current_checks", "expr": "SUM(CURRENT_CHECKS)", "description": "Transactions, not guests."}, {"name": "m_spend_per_guest", "expr": "SUM(CURRENT_SALES) / NULLIF(SUM(CURRENT_GUESTS),0)", "description": "Spend per guest, not pure price."}, {"name": "m_average_check", "expr": "SUM(CURRENT_SALES) / NULLIF(SUM(CURRENT_CHECKS),0)", "description": "Net sales per transaction."}, {"name": "m_excluded_pairs", "expr": "SUM(EXCLUDED_PAIRS)", "description": "Missing pair count. Never convert missing observations to zero."}]}], "module_custom_instructions": {"sql_generation": "Restaurant/day/date/channel paired cells. Default eight-week window 2026-07-20 through 2026-09-13. Sum rates using summed denominators. Gross losses require aggregating to restaurant first, then summing negative restaurant changes. Daypart and channel breakdowns are alternatives. Whole-window exclusion of closures removes the entire restaurant, including its pre-closure observations. Report excluded pairs with totals. Never join operations to channel rows. Guest occasions count guests served on each occasion, NOT transactions or checks and NOT unique people. Do not call guest occasions transactions, orders, or check counts. An incomplete-cell count alone cannot bound the missing volume; never assert excluded data is negligible or cannot change the conclusion. A gap present in the first observed week does not prove it began before that window; retrieve earlier evidence or leave onset unknown.  A restaurant closing during the window has both pre-closure performance and closed-day contributions; do not attribute its entire period change to closed days. Query by BUSINESS_DATE relative to CLOSE_DATE to separate them. An opening has explicit complete zero baseline observations outside its lifecycle, not missing pairs. For whole-window comparable restaurants require OPEN_DATE <= DATEADD(day,-364,window_start) and (CLOSE_DATE IS NULL OR CLOSE_DATE >= window_end_exclusive); do not hardcode restaurant IDs or names. Comparability and observation completeness are separate: always report excluded pairs. Excluding closures alone still includes openings and must not be called comparable-store growth.", "question_categorization": "Do not infer retention, profit, elasticity, causation or actual customer performance from fictional observations."}, "verified_queries": [{"name": "example_1", "question": "Which Mesa Vale restaurants lost the most guests in the eight-week window?", "sql": "SELECT RESTAURANT_ID, RESTAURANT_NAME, SUM(GUEST_CHANGE) AS GUEST_CHANGE, SUM(EXCLUDED_PAIRS) AS EXCLUDED_PAIRS FROM SNOWFLAKE_EXAMPLE.RESTAURANT_RECOVERY.PAIRED_PERFORMANCE WHERE MARKET = 'Mesa Vale' AND BUSINESS_DATE >= '2026-07-20' AND BUSINESS_DATE < '2026-09-14' GROUP BY RESTAURANT_ID, RESTAURANT_NAME ORDER BY GUEST_CHANGE LIMIT 12", "use_as_onboarding_question": true}, {"name": "example_2", "question": "What is the net guest change by market in the eight-week window?", "sql": "SELECT MARKET, SUM(GUEST_CHANGE) AS GUEST_CHANGE, SUM(CURRENT_GUESTS) AS CURRENT_GUESTS, SUM(BASELINE_GUESTS) AS BASELINE_GUESTS, SUM(EXCLUDED_PAIRS) AS EXCLUDED_PAIRS FROM SNOWFLAKE_EXAMPLE.RESTAURANT_RECOVERY.PAIRED_PERFORMANCE WHERE BUSINESS_DATE >= '2026-07-20' AND BUSINESS_DATE < '2026-09-14' GROUP BY MARKET ORDER BY MARKET", "use_as_onboarding_question": true}, {"name": "example_3", "question": "Show the eight-week Mesa Vale guest change excluding restaurants that closed during the window.", "sql": "SELECT SUM(GUEST_CHANGE) AS GUEST_CHANGE, SUM(EXCLUDED_PAIRS) AS EXCLUDED_PAIRS FROM SNOWFLAKE_EXAMPLE.RESTAURANT_RECOVERY.PAIRED_PERFORMANCE WHERE MARKET = 'Mesa Vale' AND BUSINESS_DATE >= '2026-07-20' AND BUSINESS_DATE < '2026-09-14' AND (CLOSE_DATE IS NULL OR CLOSE_DATE < '2026-07-20' OR CLOSE_DATE >= '2026-09-14')", "use_as_onboarding_question": true}]}