{"name": "SV_RESTAURANT_RECOVERY_COMPARISONS", "description": "Synthetic restaurant recovery. Guest occasions are not unique people. Descriptive analysis, never causal attribution. Expires: 2026-10-22.", "tables": [{"name": "evidence", "description": "One row per restaurant/window/peer scope. Always filter a single WINDOW_NAME. Do not sum rates or guest counts across scopes/windows. Default 8 weeks. Matching uses preceding 26 weeks only; selected-peer missingness or lifecycle change withholds the entire gap without rematching. Null gap is unavailable, never zero. Across markets is a restaurant-level descriptive comparison, not causal DMA effect. No custom peer-window recomputation is supported. Similar top-three and top-five gaps show stability only to that subset choice; they do not prove robustness to any single peer or to confounding. Guest occasions are not transactions, checks, or unique people. Similarity-selected peers are not automatically valid experiment controls; require pre-trend, confounding, and spillover review. When an exact requested window is unsupported, do not silently substitute another or claim eight weeks is closest to a thirteen-day window. Guest change requests should include the signed occasion count as well as percentage when available; use Performance for counts.", "base_table": {"database": "SNOWFLAKE_EXAMPLE", "schema": "RESTAURANT_RECOVERY", "table": "COMPARISON_EVIDENCE"}, "dimensions": [{"name": "release_id", "expr": "RELEASE_ID", "data_type": "VARCHAR", "description": "Immutable fictional release."}, {"name": "restaurant_id", "expr": "RESTAURANT_ID", "data_type": "VARCHAR", "description": "Stable fictional restaurant ID."}, {"name": "restaurant_name", "expr": "RESTAURANT_NAME", "data_type": "VARCHAR", "description": "Fictional restaurant name."}, {"name": "market", "expr": "MARKET", "data_type": "VARCHAR", "description": "Fictional market, not actual customer DMA."}, {"name": "window_name", "expr": "WINDOW_NAME", "data_type": "VARCHAR", "description": "Exactly 8 weeks or 4 weeks. Filter exactly one."}, {"name": "window_start", "expr": "WINDOW_START", "data_type": "DATE", "description": "Inclusive window start."}, {"name": "window_end", "expr": "WINDOW_END", "data_type": "DATE", "description": "Exclusive window end."}, {"name": "peer_scope", "expr": "PEER_SCOPE", "data_type": "VARCHAR", "description": "Within market or Across markets. Filter exactly one for aggregates."}, {"name": "gap_status", "expr": "GAP_STATUS", "data_type": "VARCHAR", "description": "Available or reason comparison is withheld."}, {"name": "peer_ids", "expr": "PEER_IDS", "data_type": "VARCHAR", "description": "Frozen pre-period-selected restaurant IDs."}, {"name": "peer_count", "expr": "PEER_COUNT", "data_type": "NUMBER", "description": "Number selected, minimum three."}, {"name": "focal_change_pct", "expr": "FOCAL_CHANGE_PCT", "data_type": "FLOAT", "description": "Focal percentage, not additive."}, {"name": "peer_change_pct", "expr": "PEER_CHANGE_PCT", "data_type": "FLOAT", "description": "Equal-weight peer percentage, null when withheld."}, {"name": "gap_pp", "expr": "GAP_PP", "data_type": "FLOAT", "description": "Descriptive percentage-point gap; never recoverable guests."}, {"name": "top3_gap_pp", "expr": "TOP3_GAP_PP", "data_type": "FLOAT", "description": "Sensitivity using first three of same selected peers."}, {"name": "evidence_id", "expr": "EVIDENCE_ID", "data_type": "VARCHAR", "description": "Release/restaurant/window/peer-scope identity."}], "metrics": [{"name": "m_comparison_count", "expr": "COUNT(*)", "description": "Number of comparison records, not restaurants unless scope/window fixed."}]}], "module_custom_instructions": {"sql_generation": "One row per restaurant/window/peer scope. Always filter a single WINDOW_NAME. Do not sum rates or guest counts across scopes/windows. Default 8 weeks. Matching uses preceding 26 weeks only; selected-peer missingness or lifecycle change withholds the entire gap without rematching. Null gap is unavailable, never zero. Across markets is a restaurant-level descriptive comparison, not causal DMA effect. No custom peer-window recomputation is supported. Similar top-three and top-five gaps show stability only to that subset choice; they do not prove robustness to any single peer or to confounding. Guest occasions are not transactions, checks, or unique people. Similarity-selected peers are not automatically valid experiment controls; require pre-trend, confounding, and spillover review. When an exact requested window is unsupported, do not silently substitute another or claim eight weeks is closest to a thirteen-day window. Guest change requests should include the signed occasion count as well as percentage when available; use Performance for counts.", "question_categorization": "Do not infer retention, profit, elasticity, causation or actual customer performance from fictional observations."}, "verified_queries": [{"name": "example_1", "question": "Compare R101 with its within-market and cross-market peers for eight weeks.", "sql": "SELECT RESTAURANT_ID, PEER_SCOPE, GAP_STATUS, PEER_COUNT, PEER_IDS, FOCAL_CHANGE_PCT, PEER_CHANGE_PCT, GAP_PP, TOP3_GAP_PP FROM SNOWFLAKE_EXAMPLE.RESTAURANT_RECOVERY.COMPARISON_EVIDENCE WHERE RESTAURANT_ID='R101' AND WINDOW_NAME='8 weeks' ORDER BY PEER_SCOPE", "use_as_onboarding_question": true}, {"name": "example_2", "question": "Why is R312 missing a peer comparison?", "sql": "SELECT RESTAURANT_ID, PEER_SCOPE, GAP_STATUS, PEER_COUNT FROM SNOWFLAKE_EXAMPLE.RESTAURANT_RECOVERY.COMPARISON_EVIDENCE WHERE RESTAURANT_ID='R312' AND WINDOW_NAME='8 weeks' ORDER BY PEER_SCOPE", "use_as_onboarding_question": true}, {"name": "example_3", "question": "Which eight-week comparisons are withheld?", "sql": "SELECT RESTAURANT_ID, PEER_SCOPE, GAP_STATUS, PEER_IDS FROM SNOWFLAKE_EXAMPLE.RESTAURANT_RECOVERY.COMPARISON_EVIDENCE WHERE WINDOW_NAME='8 weeks' AND GAP_STATUS <> 'Available' ORDER BY RESTAURANT_ID, PEER_SCOPE", "use_as_onboarding_question": true}]}