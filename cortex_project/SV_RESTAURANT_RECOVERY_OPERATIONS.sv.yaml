{"name": "SV_RESTAURANT_RECOVERY_OPERATIONS", "description": "Synthetic restaurant recovery. Guest occasions are not unique people. Descriptive analysis, never causal attribution. Expires: 2026-10-22.", "tables": [{"name": "evidence", "description": "One row per restaurant/date/daypart. All channels only: do not filter or allocate operational hours to a channel. Default 2026-07-20 inclusive to 2026-09-14 exclusive. Weighted service times, never mean of means. Incomplete observations withheld. Staffing changes are descriptive, not proof of cause. Opposite guest outcomes under the same labor change challenge a universal explanation but neither prove nor disprove a labor effect at either location: heterogeneous effects and confounding remain possible. Never say the other restaurant must decline if labor had any causal effect. A contrasting restaurant is not automatically an experimental control; require pre-trend comparability, confounder and spillover review. Scheduled hours and actual paid hours are different; these are paid hours. Guest occasions are not transactions or checks. Prospective switchback designs require carryover/washout and serial-correlation review. Any interim stopping rule needs a pre-specified sequential-analysis design, not repeated unadjusted significance tests.", "base_table": {"database": "SNOWFLAKE_EXAMPLE", "schema": "RESTAURANT_RECOVERY", "table": "OPERATIONS_EVIDENCE"}, "dimensions": [{"name": "release_id", "expr": "RELEASE_ID", "data_type": "VARCHAR", "description": "Immutable fictional release."}, {"name": "restaurant_id", "expr": "RESTAURANT_ID", "data_type": "VARCHAR", "description": "Stable fictional restaurant ID."}, {"name": "restaurant_name", "expr": "RESTAURANT_NAME", "data_type": "VARCHAR", "description": "Fictional restaurant name."}, {"name": "market", "expr": "MARKET", "data_type": "VARCHAR", "description": "Fictional market, not actual customer DMA."}, {"name": "business_date", "expr": "BUSINESS_DATE", "data_type": "DATE", "description": "Local business date. Default 2026-07-20 inclusive to 2026-09-14 exclusive."}, {"name": "baseline_date", "expr": "BASELINE_DATE", "data_type": "DATE", "description": "Explicit 364-day aligned baseline date."}, {"name": "as_of_date", "expr": "AS_OF_DATE", "data_type": "DATE", "description": "Fixed synthetic as-of date, not today."}, {"name": "daypart", "expr": "DAYPART", "data_type": "VARCHAR", "description": "Breakfast, Lunch, Dinner, Late night."}, {"name": "evidence_id", "expr": "EVIDENCE_ID", "data_type": "VARCHAR", "description": "Cell evidence identity; aggregate answers must also state filters and population."}], "metrics": [{"name": "m_current_open_hours", "expr": "SUM(CURRENT_OPEN_HOURS)", "description": "All-channel operating hours, once per daypart."}, {"name": "m_baseline_open_hours", "expr": "SUM(BASELINE_OPEN_HOURS)", "description": "Paired baseline hours."}, {"name": "m_current_labor_hours", "expr": "SUM(CURRENT_LABOR_HOURS)", "description": "Paid hours, not employee count."}, {"name": "m_baseline_labor_hours", "expr": "SUM(BASELINE_LABOR_HOURS)", "description": "Baseline paid hours."}, {"name": "m_current_guests", "expr": "SUM(CURRENT_GUESTS)", "description": "All-channel guests with complete operational evidence."}, {"name": "m_baseline_guests", "expr": "SUM(BASELINE_GUESTS)", "description": "Paired all-channel baseline guests."}, {"name": "m_guests_per_open_hour", "expr": "SUM(CURRENT_GUESTS)/NULLIF(SUM(CURRENT_OPEN_HOURS),0)", "description": "Not occupancy or unmet demand."}, {"name": "m_baseline_guests_per_open_hour", "expr": "SUM(BASELINE_GUESTS)/NULLIF(SUM(BASELINE_OPEN_HOURS),0)", "description": "Baseline productivity."}, {"name": "m_service_minutes", "expr": "SUM(CURRENT_SERVICE_TOTAL)/NULLIF(SUM(CURRENT_SERVICE_COUNT),0)", "description": "Observation-weighted service time."}, {"name": "m_excluded_days", "expr": "SUM(EXCLUDED_DAYS)", "description": "Excluded daypart observations."}]}], "module_custom_instructions": {"sql_generation": "One row per restaurant/date/daypart. All channels only: do not filter or allocate operational hours to a channel. Default 2026-07-20 inclusive to 2026-09-14 exclusive. Weighted service times, never mean of means. Incomplete observations withheld. Staffing changes are descriptive, not proof of cause. Opposite guest outcomes under the same labor change challenge a universal explanation but neither prove nor disprove a labor effect at either location: heterogeneous effects and confounding remain possible. Never say the other restaurant must decline if labor had any causal effect. A contrasting restaurant is not automatically an experimental control; require pre-trend comparability, confounder and spillover review. Scheduled hours and actual paid hours are different; these are paid hours. Guest occasions are not transactions or checks. Prospective switchback designs require carryover/washout and serial-correlation review. Any interim stopping rule needs a pre-specified sequential-analysis design, not repeated unadjusted significance tests.", "question_categorization": "Do not infer retention, profit, elasticity, causation or actual customer performance from fictional observations."}, "verified_queries": [{"name": "example_1", "question": "What happened to R101 breakfast hours, staffing, and guests per open hour?", "sql": "SELECT DAYPART, SUM(CURRENT_OPEN_HOURS) AS OPEN_HOURS, SUM(BASELINE_OPEN_HOURS) AS BASELINE_OPEN_HOURS, SUM(CURRENT_LABOR_HOURS) AS LABOR_HOURS, SUM(BASELINE_LABOR_HOURS) AS BASELINE_LABOR_HOURS, SUM(CURRENT_GUESTS)/NULLIF(SUM(CURRENT_OPEN_HOURS),0) AS GUESTS_PER_OPEN_HOUR, SUM(BASELINE_GUESTS)/NULLIF(SUM(BASELINE_OPEN_HOURS),0) AS BASELINE_GUESTS_PER_OPEN_HOUR, SUM(EXCLUDED_DAYS) AS EXCLUDED_DAYS FROM SNOWFLAKE_EXAMPLE.RESTAURANT_RECOVERY.OPERATIONS_EVIDENCE WHERE RESTAURANT_ID='R101' AND DAYPART='Breakfast' AND BUSINESS_DATE >= '2026-07-20' AND BUSINESS_DATE < '2026-09-14' GROUP BY DAYPART", "use_as_onboarding_question": true}, {"name": "example_2", "question": "Compare R101 and R103 breakfast labor changes in the eight-week window.", "sql": "SELECT RESTAURANT_ID, SUM(CURRENT_LABOR_HOURS) AS CURRENT_LABOR_HOURS, SUM(BASELINE_LABOR_HOURS) AS BASELINE_LABOR_HOURS, SUM(CURRENT_GUESTS) AS CURRENT_GUESTS, SUM(BASELINE_GUESTS) AS BASELINE_GUESTS FROM SNOWFLAKE_EXAMPLE.RESTAURANT_RECOVERY.OPERATIONS_EVIDENCE WHERE RESTAURANT_ID IN ('R101','R103') AND DAYPART='Breakfast' AND BUSINESS_DATE >= '2026-07-20' AND BUSINESS_DATE < '2026-09-14' GROUP BY RESTAURANT_ID", "use_as_onboarding_question": true}]}